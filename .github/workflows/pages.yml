name: Update master and publish GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # JST 12:17 (can be delayed)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned icon assets
        run: python tools/bootstrap_icons.py

      - name: Validate code
        run: |
          python -m pip install beautifulsoup4==4.13.4
          python -m unittest discover -s tests -v
          node --check app.js
          node --check sw.js
          node tests/test_sprite_cache.js
          python tools/bootstrap_icons.py

      - name: Refresh Pokémon master
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-master]')
        run: python tools/update_master.py

      # GITHUB_TOKEN commits do not trigger another Pages workflow.
      # Publish the current working directory in this same run.
      - name: Persist validated icon/master changes
        run: |
          git add -- assets/ data/master.json data/seed-data.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: sync validated PokéSleep master and branded icons'
            git push origin HEAD:main
          fi

      - name: Build static Pages artifact
        run: |
          mkdir -p .pages-public/assets .pages-public/data
          cp index.html app.js styles.css manifest.webmanifest sw.js .pages-public/
          : > .pages-public/.nojekyll
          cp assets/*.png .pages-public/assets/
          cp data/master.json data/seed-data.js .pages-public/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-public

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
