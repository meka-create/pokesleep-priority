name: Update master and publish GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 19 * * *' # JST 04:17 next day (can be delayed)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned icon assets
        run: python tools/bootstrap_icons.py

      - name: Install field artwork as first-party PNG assets
        run: python tools/bootstrap_fields.py

      - name: Validate code
        run: |
          python -m pip install beautifulsoup4==4.13.4
          python -m unittest discover -s tests -v
          node --check app.js
          node --check sw.js
          node tests/test_sprite_cache.js
          node tests/test_client_sprite_cache.js
          node tests/test_startup_performance.js
          node tests/test_details_modal_sprite.js
          node tests/test_ui_refresh.js
          node tests/test_shell_refresh.js
          node tests/test_icon_fallback.js
          node tests/test_data_integrity.js
          node tests/test_startup_master.js
          node tests/test_species_policy.js
          node tests/test_master_lifecycle.js
          node tests/test_modal_position.js
          python tools/bootstrap_fields.py
          python tools/bootstrap_icons.py

      - name: Refresh Pokémon master
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-master]')
        run: python tools/update_master.py

      - name: Validate refreshed master before publishing
        run: |
          python -m unittest discover -s tests -v
          node tests/test_species_policy.js
          node tests/test_startup_master.js
          node tests/test_master_lifecycle.js

      - name: Keep daily schedule enabled during long unchanged periods
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          # Public repo schedules can be disabled after 60 days of inactivity.
          # Preserve long-term activity without changing the Pokémon master.
          last_commit=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          if (( now - last_commit >= 35 * 24 * 60 * 60 )); then
            date -u +'%Y-%m-%dT%H:%M:%SZ' > data/schedule-keepalive.txt
            echo 'Repository idle >=35 days: keeping scheduled workflow active.'
          fi

      # GITHUB_TOKEN commits do not trigger another Pages workflow.
      # Publish the current working directory in this same run.
      - name: Persist validated icon/master changes
        run: |
          git add -- assets/ data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: sync validated PokéSleep master and branded icons'
            git push origin HEAD:main
          fi

      - name: Build static Pages artifact
        run: |
          mkdir -p .pages-public/assets .pages-public/data
          cp index.html app.js styles.css manifest.webmanifest sw.js .pages-public/
          : > .pages-public/.nojekyll
          cp assets/*.png assets/*.jpg .pages-public/assets/
          cp data/master.json data/seed-data.js .pages-public/data/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-public

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
