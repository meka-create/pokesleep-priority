name: Verify pull request changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch field and app artwork
        run: |
          python tools/bootstrap_icons.py
          python tools/bootstrap_fields.py
      - name: Run full regression suite
        run: |
          python -m pip install beautifulsoup4==4.13.4
          python -m unittest discover -s tests -v
          node --check app.js
          node --check sw.js
          for test in tests/*.js; do node "$test"; done
