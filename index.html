<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111c2c">
  <meta name="description" content="ポケモンスリープの厳選優先度を、図鑑で登録してフィールドごとに一覧できる個人用PWA。">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=018">
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon-48.png?v=018">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=018">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=0.2.11">
  <title>厳選ノート | Pokémon Sleep</title>
  <script src="./data/seed-data.js" defer></script>
  <script src="./data/candy-seed.js" defer></script>
  <script src="./app.js?v=0.2.11" defer></script>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <div class="brandmark" aria-hidden="true"><img src="./assets/icon-header-96.png" width="48" height="48" alt=""></div>
    <div class="brandtext"><span class="eyebrow">POKÉMON SLEEP</span><h1>厳選ノート</h1></div>
    <div class="count-bubble header-count" aria-label="評価済みポケモン数"><strong><span id="rated-count">0</span><span class="rated-total"> / <span id="total-count">0</span></span></strong><span>評価済み</span></div>
    <button class="icon-button" type="button" data-action="settings" aria-label="設定・バックアップ" title="設定">⚙</button>
  </header>
  <main id="main" class="main" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" class="nav-button active" data-action="tab" data-tab="dex"><span aria-hidden="true">▦</span><span>図鑑</span></button>
    <button type="button" class="nav-button" data-action="tab" data-tab="search"><span aria-hidden="true">⌕</span><span>評価検索</span></button>
    <button type="button" class="nav-button" data-action="tab" data-tab="candy"><span aria-hidden="true"><svg class="nav-candy-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="7" y="8" width="10" height="8" rx="3.5"/><path d="M7 9 4 7 2 9l2 3-2 3 2 2 3-2M17 9l3-2 2 2-2 3 2 3-2 2-3-2"/></svg></span><span>ウッウロボ</span></button>
  </nav>
</div>
<dialog class="center-dialog" id="details"><div id="details-body"></div></dialog>
<dialog class="center-dialog" id="candy-details"><div id="candy-details-body"></div></dialog>
<dialog class="bottom-sheet" id="settings-dialog"><div id="settings-body"></div></dialog>
<input type="file" id="icon-input" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="restore-input" accept="application/json,.json" hidden>
<div id="candy-type-listbox" class="candy-type-listbox" role="listbox" aria-label="アメのタイプを選択" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
